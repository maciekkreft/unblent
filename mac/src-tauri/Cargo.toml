[package]
name = "unblent"
version = "0.1.0"
description = "Unblent for Mac: a window around the local server"
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.14"
tauri-plugin-dialog = "2.8"
libc = "0.2"
# tauri::generate_context! expands to code that names these crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
