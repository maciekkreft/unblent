# Section 5: every per-user file under data/ streams continuously to R2, and a
# new user's files join on their own (watch), so no server module knows this
# runs. Credentials and the R2 endpoint, which carries the account id, come from
# the unit's EnvironmentFile, never from this file.
#
# Restoring is one command, run where the credentials and endpoint are readable
# (root). It writes a new file, the database as it was at the given UTC time (leave
# out -timestamp for the latest); inspect it before it replaces anything in data/:
#   sudo bash -c 'set -a; . /etc/unblent-litestream/r2.env; set +a; litestream restore \
#     -timestamp 2026-09-23T17:50:00Z -o /tmp/notes.db \
#     "s3://unblent-data/<user>/notes.db?endpoint=$LITESTREAM_ENDPOINT&region=auto"'
# The books files (chapters, images, source) are not databases; rclone copies
# them (deploy/unblent-books-backup.*) and restores them:
#   rclone copy r2:unblent-data/<user>/books /opt/unblent/data/<user>/books
#
# Litestream checks the bucket for every database on a timer, changed or not, and
# each check is a paid R2 list request: at its defaults (L0 clean-up every 15 s,
# L1 merge every 30 s) about 80k a day for seven files. Hourly keeps the bill in
# R2's free tier while saves still leave every 10 s; a restore is to the minute
# for the last two hours and to the hour before that.
l0-retention: 2h
l0-retention-check-interval: 1h
levels:
  - interval: 1h
  - interval: 24h
dbs:
  - dir: /opt/unblent/data
    pattern: "*.db"
    recursive: true
    watch: true
    replica:
      type: s3
      bucket: unblent-data
      endpoint: ${LITESTREAM_ENDPOINT}
      region: auto
      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
      # One R2 PUT per burst of writes rather than one per transaction.
      sync-interval: 10s
