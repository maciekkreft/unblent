  <body>
    <page-nav></page-nav>
    <dock-desk>
      <book-stage label="Reader" height="fill"><book-reader highlights height="fill"></book-reader></book-stage>
      <list-then-item id="books" label="Books" side="left" height="fill" shows-on="book.selected">
        <book-shelf label="Books" renames></book-shelf>
        <book-toc shows-on="book.selected"></book-toc>
      </list-then-item>
      <list-then-item id="notes" label="Notes" side="right" height="fill" shows-on="note.selected">
        <note-list subject highlights label="Notes"></note-list>
        <note-editor shows-on="note.selected" follows subject height="fill"></note-editor>
        <highlight-notes shows-on="highlights.selected" height="fill"></highlight-notes>
      </list-then-item>
      <layout-switch control></layout-switch>
      <session-switch control></session-switch>
    </dock-desk>
    <viewport-switch></viewport-switch>
    <notice-stack></notice-stack>
  </body>
